services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: club
      POSTGRES_PASSWORD: club
      POSTGRES_DB: club_insights
    ports:
      - "5434:5432" # 5434 on the host to avoid clashing with local PostgreSQL installs (5432/5433)
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U club -d club_insights"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
